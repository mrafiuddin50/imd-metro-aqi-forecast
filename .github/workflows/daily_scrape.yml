name: Daily IMD Metro Air Quality Forecast Scraper

on:
  schedule:
    # Main run: 02:17 UTC = 07:47 IST.
    - cron: '17 2 * * *'
    # Backup run: 05:17 UTC = 10:47 IST. Catches the day's data if the main run
    # failed or IMD was down. If the main run worked and nothing has changed,
    # the backup finds no changes and makes no commit.
    - cron: '17 5 * * *'
    # Minute 17 keeps clear of the top of the hour, when GitHub's shared
    # machines are busiest. GitHub can still start scheduled runs late on
    # busy days.

  # Adds a "Run workflow" button on the Actions tab for manual runs.
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs overlap (e.g. a manual run during the scheduled one).
concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # If the scraper reports a problem we still save whatever data it did
      # collect (next step), then mark the run as failed (last step).
      - name: Run scraper
        id: scrape
        continue-on-error: true
        run: python scripts/imd_scraper.py

      - name: Commit and push data changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Auto-update IMD metro forecasts [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git pull --rebase origin main
          git push

      - name: Mark the run as failed if the scraper reported a problem
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::error::The scraper reported a problem. Open the 'Run scraper' step for details."
          exit 1
